name: Build RPM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: RPM (${{ matrix.dist }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: el9
            image: almalinux:9
            extra_repo: crb
    container:
      image: ${{ matrix.image }}

    steps:
      # git must exist before checkout so actions/checkout makes a real
      # clone (needed for `git archive` below).
      - name: Install build tooling
        run: |
          dnf -y install dnf-plugins-core epel-release git rpm-build rpmdevtools
          dnf config-manager --set-enabled ${{ matrix.extra_repo }}
          # Official XRootD stable repo (ships XRootD 6.x, as the spec requires).
          rpm --import https://xrootd.web.cern.ch/repo/RPM-GPG-KEY.txt
          dnf config-manager --add-repo https://xrootd.web.cern.ch/xrootd.repo

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install BuildRequires
        run: dnf -y builddep rpm/xrootd-multiuser.spec

      - name: Create source tarball
        id: source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          version=$(rpmspec -q --srpm --qf '%{version}' rpm/xrootd-multiuser.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git archive HEAD --prefix="xrootd-multiuser-${version}/" \
            | gzip -7 > ~/rpmbuild/SOURCES/xrootd-multiuser-${version}.tar.gz

      - name: Build RPMs
        run: rpmbuild -ba rpm/xrootd-multiuser.spec

      - name: Collect RPMs
        run: |
          mkdir -p dist
          cp ~/rpmbuild/SRPMS/*.rpm ~/rpmbuild/RPMS/*/*.rpm dist/
          ls -l dist

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: xrootd-multiuser-${{ steps.source.outputs.version }}-${{ matrix.dist }}
          path: dist/*.rpm
          if-no-files-found: error
